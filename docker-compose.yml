services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev # ← Changed
    # A tiny init process (tini) runs as PID 1 and passes Ctrl+C / "docker compose
    # down" on to Next.js, so the container stops at once instead of hanging
    init: true
    stop_grace_period: 5s
    ports:
      - '3000:3000' # ← Changed to 3000 (standard dev port)
    volumes:
      # Mount source code for hot reload
      - .:/app
      # Prevent overwriting installed dependencies
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development # ← Changed to development
      - PYTHON_PATH=/usr/bin/python3
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME:-network-graph}
      - PINECONE_HOST=${PINECONE_HOST}
      - PINECONE_NAMESPACE=${PINECONE_NAMESPACE:-example-namespace}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN=${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN:-}
      - NEXT_PUBLIC_POSTHOG_HOST=${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
      - DATABASE_URL=postgres://app:app@db:5432/network_graph
    # The database is up and its tables are set up before the app starts
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Postgres: the system of record (workstreams, full documents, chats, reports).
  # Its data lives in the db-data volume, so it survives restarts.
  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=app
      - POSTGRES_DB=network_graph
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d network_graph']
      interval: 2s
      timeout: 3s
      retries: 30

  # Applies new files from db/migrations once the database is ready, then exits
  migrate:
    # The app's own image, so it has the same node_modules (built from the lockfile)
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: node scripts/migrate.mjs
    environment:
      - DATABASE_URL=postgres://app:app@db:5432/network_graph
    volumes:
      - ./db:/app/db:ro
      - ./scripts:/app/scripts:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
