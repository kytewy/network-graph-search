services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev # ← Changed
    # A tiny init process (tini) runs as PID 1 and passes Ctrl+C / "docker compose
    # down" on to Next.js, so the container stops at once instead of hanging
    init: true
    stop_grace_period: 5s
    ports:
      - '3000:3000' # ← Changed to 3000 (standard dev port)
    volumes:
      # Mount source code for hot reload
      - .:/app
      # Prevent overwriting installed dependencies
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development # ← Changed to development
      - PYTHON_PATH=/usr/bin/python3
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME:-network-graph}
      - PINECONE_HOST=${PINECONE_HOST}
      - PINECONE_NAMESPACE=${PINECONE_NAMESPACE:-example-namespace}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN=${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN:-}
      - NEXT_PUBLIC_POSTHOG_HOST=${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
